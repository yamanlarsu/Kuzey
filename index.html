<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Phantom Delivery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Phantom Delivery</h1>

  <!-- Adres -->
  <div>
    <label>Adres:</label>
    <input type="text" id="address" placeholder="289/16 Sk.">
  </div>

  <!-- Su adedi -->
  <div>
    <label>Su Adedi:</label>
    <input type="number" id="waterCount" value="1">
  </div>

  <!-- Ödeme -->
  <div>
    <label>Ödeme:</label>
    <select id="payment">
      <option value="Nakit">Nakit</option>
      <option value="Online">Online</option>
      <option value="Ödendi">Ödendi</option>
    </select>
  </div>

  <!-- Kurye seçimi -->
  <div>
    <label>Kurye Seç:</label>
    <select id="courier">
      <option value="Emre">Emre</option>
      <option value="Ayşe">Ayşe</option>
      <option value="Murat">Murat</option>
      <option value="Can">Can</option>
    </select>
  </div>

  <!-- Gönder butonu -->
  <button onclick="sendOrder()">Gönder</button>

  <h2>Sipariş Özeti</h2>
  <ul id="orderHistory"></ul>

  <script src="script.js"></script>
</body>
</html>
